# ==============================================================================
# AlmaLinux 9 / RHEL Apache 2.4 Production Reverse Proxy Configuration
# Repository: almalinux-nodejs-vps-deploykit
# Location: /etc/httpd/conf.d/app.conf
# ==============================================================================

# Enable HTTP/2 Protocol globally or inside VHost (if mod_http2 is loaded)
<IfModule mod_http2.c>
    Protocols h2 http/1.1
</IfModule>

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Automatic Canonical 301 Redirect to HTTPS
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com
    ServerAdmin webmaster@example.com

    # Allow Let's Encrypt ACME challenge verification over HTTP
    DocumentRoot /var/www/html
    <Directory "/var/www/html/.well-known">
        AllowOverride None
        Require all granted
    </Directory>

    # Force 301 Permanent Redirect to HTTPS for all application traffic
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog /var/log/httpd/app_error.log
    CustomLog /var/log/httpd/app_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# HTTPS (Port 443) -> Reverse Proxy to Node.js (127.0.0.1:3000)
# ------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com
    ServerAdmin webmaster@example.com

    # SSL / TLS Modern Cryptographic Configuration
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # SSL Certificate Paths (Certbot / Let's Encrypt standard location)
    SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
    # Fallback to AlmaLinux default self-signed cert if testing without domain:
    # SSLCertificateFile /etc/pki/tls/certs/localhost.crt
    # SSLCertificateKeyFile /etc/pki/tls/private/localhost.key

    # --------------------------------------------------------------------------
    # Production Security Headers
    # --------------------------------------------------------------------------
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # --------------------------------------------------------------------------
    # Gzip / Deflate Compression Optimization
    # --------------------------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript
        AddOutputFilterByType DEFLATE application/javascript application/json application/xml
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # --------------------------------------------------------------------------
    # WebSocket & Reverse Proxy Directives
    # --------------------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off

    # Forwarding Headers for Node.js Application
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # WebSocket Upgrade Tunneling (ws://127.0.0.1:3000)
    # Checks for both Upgrade: websocket and Connection: Upgrade headers
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*)         ws://127.0.0.1:3000/$1 [P,L,QSA]

    # Forward WebSocket upgrade headers to backend if supported by client
    RequestHeader set Upgrade %{HTTP:Upgrade}e env=HTTP:Upgrade
    RequestHeader set Connection %{HTTP:Connection}e env=HTTP:Connection

    # HTTP Reverse Proxy Routing
    ProxyPass / http://127.0.0.1:3000/ retry=2 timeout=60 keepalive=On
    ProxyPassReverse / http://127.0.0.1:3000/

    # Static Asset Caching (Optional if serving directly through Apache)
    # Alias /static /opt/nodeapp/current/public
    # <Directory "/opt/nodeapp/current/public">
    #     Require all granted
    #     ExpiresActive On
    #     ExpiresDefault "access plus 1 month"
    # </Directory>

    # Logging
    LogLevel warn
    ErrorLog /var/log/httpd/app_error.log
    CustomLog /var/log/httpd/app_access.log combined
</VirtualHost>
