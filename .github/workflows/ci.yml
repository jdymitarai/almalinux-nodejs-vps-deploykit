name: CI & Deployment Pipeline Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-scripts:
    name: Shell Script Syntax & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Bash Syntax (bash -n)
        run: |
          for script in deploy.sh rollback.sh healthcheck.sh init_db.sh; do
            echo "Checking syntax for ${script}..."
            bash -n "${script}"
          done

      - name: Run ShellCheck Static Analysis
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: 'node_modules,sample-app/node_modules'
          severity: error

  test-sample-app:
    name: Reference Node.js Server Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies via npm ci
        working-directory: ./sample-app
        run: |
          npm ci

      - name: Run Sample App Integration Tests
        working-directory: ./sample-app
        run: |
          npm test

  validate-configs:
    name: Configuration & Service Directives Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate systemd unit syntax
        run: |
          grep -q "ExecStart=" app.service
          grep -q "Restart=" app.service
          grep -q "ProtectSystem=" app.service
          grep -q "NoNewPrivileges=true" app.service
          grep -q "LimitNOFILE=65536" app.service
          echo "app.service directives verified."

      - name: Validate Apache configuration format
        run: |
          grep -Fq "<VirtualHost *:80>" app.conf
          grep -Fq "<VirtualHost *:443>" app.conf
          grep -Fq "ProxyPass / http://127.0.0.1:3000/" app.conf
          grep -Fq "ProxyPassReverse / http://127.0.0.1:3000/" app.conf
          grep -Fq "RewriteCond %{HTTP:Upgrade} websocket" app.conf
          grep -Fq "RewriteCond %{HTTP:Connection} upgrade" app.conf
          echo "app.conf directives verified."

      - name: Validate Schema SQL definitions
        run: |
          grep -Fq "CREATE TABLE IF NOT EXISTS \`users\`" schema.sql
          grep -Fq "CREATE TABLE IF NOT EXISTS \`app_migrations\`" schema.sql
          grep -Fq "CREATE TABLE IF NOT EXISTS \`audit_logs\`" schema.sql
          echo "schema.sql tables verified."
